[package]
name = "viva"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Viva Personal AI Office — local office host foundation (V01/G0)"

[lib]
name = "viva"
path = "src/lib.rs"

[[bin]]
name = "viva"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
# V05 (issue #14) terminal emulation; since S3 (issue #45) the PTY backend
# is owned (src/terminal/pty.rs, libc) so the master fd is transferable for
# live handoff — portable-pty never exposed it. vt100 parses raw output
# into a bounded grid + scrollback.
vt100 = "0.16.2"
# V06 (issue #15): the office TUI shell (the only physical-terminal
# renderer). crossterm comes through ratatui's re-export to keep the
# versions locked together.
ratatui = "0.30.2"
semver = "1.0.28"
sha2 = "0.10.9"
tempfile = "3.27.0"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
# Process-group signalling for supervised terminal trees (stop/escalate).
libc = "0.2.177"
