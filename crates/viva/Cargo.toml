[package]
name = "viva"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Viva Personal AI Office — local office host foundation (V01/G0)"

[lib]
name = "viva"
path = "src/lib.rs"

[[bin]]
name = "viva"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
# V05 (issue #14): real PTY handling and terminal emulation. portable-pty
# owns the pty/session discipline (setsid + controlling terminal on Unix);
# vt100 parses raw output into a bounded grid + scrollback.
portable-pty = "0.9.0"
vt100 = "0.16.2"
# V06 (issue #15): the office TUI shell (the only physical-terminal
# renderer). crossterm comes through ratatui's re-export to keep the
# versions locked together.
ratatui = "0.30.2"

[target.'cfg(unix)'.dependencies]
# Process-group signalling for supervised terminal trees (stop/escalate).
libc = "0.2.177"

[dev-dependencies]
tempfile = "3.27.0"
