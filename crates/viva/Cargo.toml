[package]
name = "viva"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Viva Personal AI Office — local office host foundation (V01/G0)"

[lib]
name = "viva"
path = "src/lib.rs"

[[bin]]
name = "viva"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
time = { version = "0.3.45", features = ["formatting", "parsing"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
