[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva"
version = "0.1.0"
description = "A persistent habitat for AI agents to live, work, remember, and grow."
readme = "README.md"
# PEP 639 SPDX expression; the string form requires setuptools>=77 (see build-system).
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The Viva shell depends on Textual for the Phase 1 TUI product surface (the
# rationale, alternatives, and stdlib-gap analysis live in
# docs/architecture/viva-transition.md §5). The legacy Ticket Autopilot
# subsystem itself remains standard-library-only.
dependencies = ["textual>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
viva = "viva.cli:main"
# Legacy delivery-subsystem entry point (kept until an explicit migration).
ticket-controller = "ticket_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticket_autopilot = ["schemas/*.json", "workflows/*.yaml", "static/*.html", "static/*.css", "static/*.js"]
