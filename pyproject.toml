[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-autopilot"
version = "0.1.0"
description = "Lightweight local controller that turns a structured ticket into a verified, independently QA'd GitHub PR."
readme = "README.md"
# SPDX license metadata requires setuptools>=77.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Runtime uses only the Python standard library; keeping this explicit makes a
# clean product install independent of a developer's globally installed tools.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ticket-controller = "ticket_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticket_autopilot = ["schemas/*.json", "workflows/*.yaml", "static/*.html", "static/*.css", "static/*.js"]
