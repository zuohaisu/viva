[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva"
version = "0.1.0"
description = "A local-first Personal AI Office: persistent AI members, tasks, executions, and the history that outlives any worker session."
readme = "README.md"
# PEP 639 SPDX expression; the string form requires setuptools>=77 (see build-system).
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Textual is the only runtime dependency: it is the office's interactive surface
# (rationale, alternatives and the stdlib-gap analysis live in
# docs/architecture/conceptual-architecture.md). Everything else is stdlib.
dependencies = ["textual>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
viva = "viva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
