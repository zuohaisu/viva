name: CI

# One workflow answers "is the branch green" for every PR and every main
# push: the Rust gate (fmt/clippy/test), the Python acceptance tooling,
# and the Pi extension. The former `rust.yml` / `ci.yml` split was merged
# here (2026-10) so a single Actions entry carries the verdict.
#
# No `paths` filter on purpose: every PR reports every check, so required
# status checks can be enabled later without a path-filtered workflow
# silently never reporting on docs-only PRs. The Rust job costs ~1.5 min
# warm (rust-cache). Releases stay in their own tag-triggered workflow
# (release.yml) — different trigger surface, permissions, and secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    # Hard ceiling (issue #45 QA round 2): a hung test must cancel the job
    # with its log intact instead of burning hours silently.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # The step-level bound fires before the job ceiling, so the log
        # always names the last test that started (the hung run only said
        # "running for over 60 seconds" and then nothing for 3 hours).
        run: timeout -k 30 600 cargo test --workspace -- --nocapture
        timeout-minutes: 12

  # The Python product runtime is retired (V13, issue #22); the only Python
  # left is the acceptance tooling under tools/acceptance, which is
  # stdlib-only and tested with pytest.
  acceptance-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run acceptance tooling tests
        run: python -m pytest tests/acceptance -q

  pi-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck + test the Pi extension (strict tsc + node:test)
        working-directory: extensions/pi
        run: |
          npm ci
          npm run typecheck
          npm test
