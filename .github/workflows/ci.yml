name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The Python product runtime is retired (V13, issue #22); the only Python
  # left is the acceptance tooling under tools/acceptance, which is
  # stdlib-only and tested with pytest.
  acceptance-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run acceptance tooling tests
        run: python -m pytest tests/acceptance -q
