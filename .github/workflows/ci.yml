name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pyyaml pytest textual
      - name: Run engine tests
        run: PYTHONPATH=src python -m pytest src/ticket_autopilot/engine/tests/ -q
      - name: Run Viva product tests
        run: PYTHONPATH=src python -m pytest tests/viva/ -q
