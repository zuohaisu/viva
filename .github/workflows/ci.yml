name: CI

# One workflow answers "is the branch green" for every PR and every main
# push: the Rust gate (fmt/clippy/test), the Python acceptance tooling,
# and the Pi extension. The former `rust.yml` / `ci.yml` split was merged
# here (2026-10) so a single Actions entry carries the verdict.
#
# No `paths` filter on purpose: every PR reports every check, so required
# status checks can be enabled later without a path-filtered workflow
# silently never reporting on docs-only PRs. The Rust job costs ~1.5 min
# warm (rust-cache). GitHub Releases stay in the tag-triggered workflow
# (release.yml). npm publish is the separate manual workflow
# (npm-publish.yml). Both differ from this file in trigger, permissions,
# and secrets.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    # Hard ceiling (issue #45 QA round 2): a hung test must cancel the job
    # with its log intact instead of burning hours silently.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # The step-level bound fires before the job ceiling, so the log
        # always names the last test that started (the hung run only said
        # "running for over 60 seconds" and then nothing for 3 hours).
        run: timeout -k 30 600 cargo test --workspace -- --nocapture
        timeout-minutes: 12

  # The Python product runtime is retired (V13, issue #22); the only Python
  # left is the acceptance tooling under tools/acceptance, which is
  # stdlib-only and tested with pytest.
  #
  # These tests drive the REAL viva binary (the peak scenario starts
  # `viva server`), so this job builds it first. Before issue #66 it did not,
  # and the two tests that need the binary were skipped on every CI run. A
  # missing binary is now a test failure, not a skip.
  acceptance-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The startup-upgrade probe builds the recorded pre-#191 binary;
          # it must not replace that baseline with another current build.
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the herdr source inventory (real committed Git tree, no build/network)
        run: python -m unittest discover -s tooling/herdr-audit -v
      - name: Install pytest
        run: python -m pip install pytest
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build the real viva binary
        run: cargo build -p viva
      - name: Verify startup handoff with real old and current binaries
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/viva-191-baseline"
          mkdir -p "$BASE"
          git archive 9935ebbd5f0b20fbf2d9e82bb798106929f94261 | tar -x -C "$BASE"
          CARGO_TARGET_DIR="$BASE/target" cargo build --locked --manifest-path "$BASE/Cargo.toml" -p viva
          python tooling/herdr-integration/startup_handoff.py \
            --server-bin "$BASE/target/debug/viva" --candidate-bin target/debug/viva \
            --expect handoff --clients 2 --output "$RUNNER_TEMP/startup-old-to-current.json"
          python tooling/herdr-integration/startup_handoff.py \
            --server-bin target/debug/viva --candidate-bin target/debug/viva \
            --expect attach --output "$RUNNER_TEMP/startup-current-to-current.json"
          python tooling/herdr-integration/startup_handoff.py \
            --server-bin target/debug/viva --candidate-bin target/debug/viva \
            --replace-server-on-disk "$BASE/target/debug/viva" \
            --expect attach --output "$RUNNER_TEMP/startup-replaced-path.json"
      - name: Verify prepared handoff failures and incompatible older receiver
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS="$RUNNER_TEMP/viva-196-previous"
          mkdir -p "$PREVIOUS"
          git archive 4a7d8fb8e54c816c289935f42599e08c521ef025 | tar -x -C "$PREVIOUS"
          CARGO_TARGET_DIR="$PREVIOUS/target" cargo build --locked --manifest-path "$PREVIOUS/Cargo.toml" -p viva
          python tooling/herdr-integration/startup_handoff.py \
            --server-bin "$PREVIOUS/target/debug/viva" --candidate-bin target/debug/viva \
            --expect handoff --output "$RUNNER_TEMP/startup-v1-to-prepared.json"
          python tooling/herdr-integration/startup_handoff.py \
            --server-bin target/debug/viva --candidate-bin "$PREVIOUS/target/debug/viva" \
            --expect refused --output "$RUNNER_TEMP/startup-older-receiver-refused.json"
          python tooling/herdr-integration/startup_handoff.py \
            --server-bin "$PREVIOUS/target/debug/viva" --candidate-bin target/debug/viva \
            --expect refused --occupy-prepared-endpoints \
            --output "$RUNNER_TEMP/startup-failure-old-still-serving.json"
          python tooling/herdr-integration/startup_handoff.py \
            --server-bin target/debug/viva --candidate-bin target/debug/viva \
            --inject-old-receiver "$PREVIOUS/target/debug/viva" \
            --expect attach --output "$RUNNER_TEMP/startup-sender-rollback.json"
          for fault in bad-second-owner bind-failure alias-obstructed; do
            python tooling/herdr-integration/handoff_faults.py \
              --binary target/debug/viva --fault "$fault" \
              --output "$RUNNER_TEMP/startup-fault-$fault.json"
          done
      - name: Retain startup handoff evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-handoff-evidence
          path: ${{ runner.temp }}/startup-*.json
          if-no-files-found: warn
      - name: Run acceptance tooling tests
        # -rs lists every skipped test with its reason in the log; the
        # expected skip count is 0.
        run: python -m pytest tests/acceptance -q -rs

  # #191 development gate: the default Linux jobs do NOT compile the nested
  # native runtime. Keep actual source composition and PTY evidence separate
  # from same-backend handoff, install and human visual acceptance.
  native-runtime:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      # Match the isolated native baseline, not runner/user Git defaults.
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Use the imported native Rust toolchain
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          channel = tomllib.loads(pathlib.Path('upstream/herdr/rust-toolchain.toml').read_text())['toolchain']['channel']
          subprocess.run(['rustup', 'toolchain', 'install', channel, '--component', 'clippy,rustfmt'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RUSTUP_TOOLCHAIN={channel}\n')
          PY
      - name: Install the original hash-pinned Zig 0.16.0
        run: |
          curl --fail --location --retry 2 https://ziglang.org/download/0.16.0/zig-x86_64-macos-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "ZIG=$RUNNER_TEMP/zig-x86_64-macos-0.16.0/zig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-runtime
          workspaces: |
            . -> target
            upstream/herdr -> target
      - name: Native feature clippy
        run: cargo clippy -p viva --features herdr-runtime --all-targets -- -D warnings
      - name: Imported native source clippy
        run: cargo clippy --manifest-path upstream/herdr/Cargo.toml --all-targets -- -D warnings
      - name: Test native client capability and lifetime admission
        run: |
          cargo test -p viva --locked --features herdr-runtime --lib native_runtime:: -- --nocapture
      - name: Test actual source-linked domain bridge and inherited PTY contract
        run: cargo test -p viva --locked --features herdr-runtime --test native_runtime_bridge --test native_execution --test native_member_ingress --test native_control --test m1_terminal -- --nocapture
      - name: Install the original hash-pinned isolated test runner
        run: |
          curl --fail --location --retry 2 https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-universal-apple-darwin.tar.gz -o "$RUNNER_TEMP/nextest.tar.gz"
          echo "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"
      - name: Install the genuine checksum CLI used by native maintenance tests
        run: |
          curl --fail --location --retry 2 https://github.com/uutils/coreutils/releases/download/0.2.2/coreutils-0.2.2-x86_64-apple-darwin.tar.gz -o "$RUNNER_TEMP/coreutils.tar.gz"
          echo "d60533c66d5f9d8b4c5aaec3837a25ef8b82227c1ace780c2d97f94da1c8b229  $RUNNER_TEMP/coreutils.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/coreutils.tar.gz" -C "$RUNNER_TEMP"
          ln -s "$RUNNER_TEMP/coreutils-0.2.2-x86_64-apple-darwin/coreutils" "$RUNNER_TEMP/nextest-bin/sha256sum"
      - name: Test native maintenance tooling
        working-directory: upstream/herdr
        run: |
          git --version
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test imported native workspace and frozen codecs in isolated processes
        # Reuse the upstream justfile's runner. A shared cargo-test process can
        # inherit signal handlers changed by another native test (SIGPIPE).
        run: cargo nextest run --manifest-path upstream/herdr/Cargo.toml --workspace --locked --test-threads 2 --no-fail-fast --status-level fail --final-status-level fail
      - name: Build actual source-linked client
        run: cargo build -p viva --locked --features herdr-runtime
      - name: Verify native autospawn, PTY, detach and live reattach
        run: python tooling/herdr-integration/native_runtime.py --viva target/debug/viva --output "$RUNNER_TEMP/native-runtime.json"
      - name: Retain native evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-evidence
          path: ${{ runner.temp }}/native-runtime.json
          if-no-files-found: warn

  pi-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The extension's contract test (issue #86) runs its tools against the
      # REAL viva binary, so this job needs the Rust toolchain too.
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build the real viva binary
        run: cargo build -p viva
      - name: Install the Pi extension dependencies (pinned real Pi + typebox)
        working-directory: extensions/pi
        run: npm ci
      - name: Typecheck the Pi extension (strict tsc, real Pi types)
        working-directory: extensions/pi
        run: npm run typecheck
      # Issue #101: load the extension in the REAL Pi (the pinned version npm ci
      # just installed, no global install, no model credentials) and check the
      # tools it registers. Its own step so a failure names itself; `npm test`
      # below runs it again with the rest of the suite.
      - name: Load the extension in the real Pi (smoke)
        working-directory: extensions/pi
        run: npm run test:real-pi
      - name: Test the Pi extension (node:test)
        working-directory: extensions/pi
        env:
          # The contract test runs the extension against this real binary.
          VIVA_BIN: ${{ github.workspace }}/target/debug/viva
        run: npm test
