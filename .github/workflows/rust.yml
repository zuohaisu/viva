name: Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    # Hard ceiling (issue #45 QA round 2): a hung test must cancel the job
    # with its log intact instead of burning hours silently.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        # The step-level bound fires before the job ceiling, so the log
        # always names the last test that started (the hung run only said
        # "running for over 60 seconds" and then nothing for 3 hours).
        run: timeout -k 30 600 cargo test --workspace -- --nocapture
        timeout-minutes: 12
